location:
  name: Karachi
  latitude: 24.8607
  longitude: 67.0011
  timezone: Asia/Karachi

mongodb:
  database: aqi_predictor
  feature_collection: aqi_hourly_v1
  model_collection: model_registry
  model_name: aqi_forecaster

data:
  backfill_days: 365
  forecast_horizons_h: [24, 48, 72]
  forecast_steps_h: 96
  train_test_split: 0.8

alerts:
  good_max: 50
  moderate_max: 100
  sensitive_max: 150
  unhealthy_max: 200
